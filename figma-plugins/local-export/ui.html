<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }

      main {
        display: grid;
        gap: 16px;
        padding: 20px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: var(--figma-color-text-secondary);
        line-height: 1.5;
      }

      .status {
        display: grid;
        gap: 8px;
        min-height: 56px;
        padding: 12px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        background: var(--figma-color-bg-secondary);
      }

      .status-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .status-line span:last-child {
        color: var(--figma-color-text-secondary);
        font-variant-numeric: tabular-nums;
      }

      progress {
        width: 100%;
        height: 6px;
        accent-color: var(--figma-color-bg-brand);
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      button {
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .details {
        color: var(--figma-color-text-tertiary);
        font-size: 12px;
        line-height: 1.45;
      }

      .error {
        color: var(--figma-color-text-danger);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>导出本地快照</h1>
        <p>读取当前 Figma 文件的页面、节点、原型交互、样式与截图。</p>
      </header>

      <section class="status" aria-live="polite">
        <div class="status-line">
          <strong id="status-label">准备导出</strong>
          <span id="status-count"></span>
        </div>
        <progress id="progress" value="0" max="1"></progress>
        <p id="status-detail">完整 ZIP 约等于一次 Figma 文件备份。</p>
      </section>

      <section class="actions">
        <button id="start" class="primary">扫描当前文件</button>
        <button id="download-zip" disabled>下载完整 ZIP</button>
        <button id="download-json" disabled>仅下载 snapshot.json</button>
      </section>

      <p class="details">
        ZIP 内含 <code>snapshot.json</code>、顶层画板截图和节点引用的原始图片。
        数据只在本地 Figma 插件中生成，不经过网络。
      </p>
    </main>

    <script>
      const startButton = document.getElementById("start");
      const zipButton = document.getElementById("download-zip");
      const jsonButton = document.getElementById("download-json");
      const statusLabel = document.getElementById("status-label");
      const statusCount = document.getElementById("status-count");
      const statusDetail = document.getElementById("status-detail");
      const progress = document.getElementById("progress");

      let snapshot = null;
      let snapshotFilename = "figma-snapshot.json";
      let assets = [];
      let currentAsset = null;
      let snapshotParts = [];
      let exporting = false;

      startButton.addEventListener("click", startExport);
      zipButton.addEventListener("click", downloadZip);
      jsonButton.addEventListener("click", downloadJson);

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "progress") {
          setProgress(message);
          return;
        }

        if (message.type === "asset-start") {
          currentAsset = {
            path: message.path,
            byteLength: message.byteLength,
            parts: []
          };
          return;
        }

        if (message.type === "asset-chunk") {
          if (currentAsset) {
            currentAsset.parts.push(message.chunk);
          }
          return;
        }

        if (message.type === "asset-end") {
          if (!currentAsset) return;
          assets.push({
            path: currentAsset.path,
            data: base64ToBytes(currentAsset.parts.join(""))
          });
          currentAsset = null;
          return;
        }

        if (message.type === "snapshot-start") {
          snapshotFilename = message.filename;
          snapshotParts = [];
          return;
        }

        if (message.type === "snapshot-chunk") {
          snapshotParts.push(message.chunk);
          return;
        }

        if (message.type === "snapshot-end") {
          snapshot = snapshotParts.join("");
          snapshotParts = [];
          exporting = false;
          startButton.disabled = false;
          zipButton.disabled = false;
          jsonButton.disabled = false;
          statusLabel.textContent = "导出完成";
          statusDetail.textContent = `已收集 ${assets.length} 个资源，可下载 ZIP 或 JSON。`;
          progress.value = progress.max;
          return;
        }

        if (message.type === "complete") {
          exporting = false;
          startButton.disabled = false;
          return;
        }

        if (message.type === "error") {
          exporting = false;
          startButton.disabled = false;
          statusLabel.textContent = "导出失败";
          statusLabel.className = "error";
          statusDetail.textContent = message.message;
        }
      };

      function startExport() {
        if (exporting) return;
        exporting = true;
        snapshot = null;
        assets = [];
        currentAsset = null;
        snapshotParts = [];
        zipButton.disabled = true;
        jsonButton.disabled = true;
        startButton.disabled = true;
        statusLabel.className = "";
        statusLabel.textContent = "正在扫描";
        statusDetail.textContent = "请保持当前 Figma 文件打开。";
        progress.value = 0;
        progress.max = 1;
        statusCount.textContent = "";
        parent.postMessage({ pluginMessage: { type: "export" } }, "*");
      }

      function setProgress(message) {
        statusLabel.textContent = message.message || "处理中";
        if (typeof message.current === "number" && typeof message.total === "number") {
          progress.max = Math.max(1, message.total);
          progress.value = Math.min(message.current, progress.max);
          statusCount.textContent = `${message.current} / ${message.total}`;
        } else {
          progress.removeAttribute("value");
          statusCount.textContent = "";
        }
      }

      function downloadJson() {
        if (!snapshot) return;
        const blob = new Blob([snapshot], { type: "application/json" });
        downloadBlob(blob, snapshotFilename);
      }

      function downloadZip() {
        if (!snapshot) return;
        const encoder = new TextEncoder();
        const files = [
          {
            path: "snapshot.json",
            data: encoder.encode(snapshot)
          },
          {
            path: "README.txt",
            data: encoder.encode(
              [
                "StudyNotes Figma local snapshot",
                "",
                "snapshot.json contains the normalized Figma document tree.",
                "screenshots/ contains one PNG for each visible top-level frame.",
                "images/ contains original image fills referenced by imageHash.",
                "",
                "Query the snapshot without Figma MCP:",
                "  node scripts/figma-snapshot.mjs this-file.zip summary",
                "  node scripts/figma-snapshot.mjs this-file.zip screens",
                "  node scripts/figma-snapshot.mjs this-file.zip interactions",
                "  node scripts/figma-snapshot.mjs this-file.zip text \"关键词\""
              ].join("\n")
            )
          },
          ...assets
        ];

        const zip = createZip(files);
        downloadBlob(
          new Blob([zip], { type: "application/zip" }),
          snapshotFilename.replace(/-snapshot\.json$/, ".figma-snapshot.zip")
        );
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function base64ToBytes(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      function createZip(files) {
        const encoder = new TextEncoder();
        const localParts = [];
        const centralParts = [];
        const now = new Date();
        const dosTime =
          (now.getHours() << 11) |
          (now.getMinutes() << 5) |
          Math.floor(now.getSeconds() / 2);
        const dosDate =
          ((now.getFullYear() - 1980) << 9) |
          ((now.getMonth() + 1) << 5) |
          now.getDate();
        let offset = 0;

        for (const file of files) {
          const name = encoder.encode(file.path);
          const data =
            typeof file.data === "string" ? encoder.encode(file.data) : file.data;
          const checksum = crc32(data);

          const localHeader = new Uint8Array(30 + name.length);
          const localView = new DataView(localHeader.buffer);
          localView.setUint32(0, 0x04034b50, true);
          localView.setUint16(4, 20, true);
          localView.setUint16(6, 0x0800, true);
          localView.setUint16(8, 0, true);
          localView.setUint16(10, dosTime, true);
          localView.setUint16(12, dosDate, true);
          localView.setUint32(14, checksum, true);
          localView.setUint32(18, data.length, true);
          localView.setUint32(22, data.length, true);
          localView.setUint16(26, name.length, true);
          localView.setUint16(28, 0, true);
          localHeader.set(name, 30);

          localParts.push(localHeader, data);

          const centralHeader = new Uint8Array(46 + name.length);
          const centralView = new DataView(centralHeader.buffer);
          centralView.setUint32(0, 0x02014b50, true);
          centralView.setUint16(4, 20, true);
          centralView.setUint16(6, 20, true);
          centralView.setUint16(8, 0x0800, true);
          centralView.setUint16(10, 0, true);
          centralView.setUint16(12, dosTime, true);
          centralView.setUint16(14, dosDate, true);
          centralView.setUint32(16, checksum, true);
          centralView.setUint32(20, data.length, true);
          centralView.setUint32(24, data.length, true);
          centralView.setUint16(28, name.length, true);
          centralView.setUint16(30, 0, true);
          centralView.setUint16(32, 0, true);
          centralView.setUint16(34, 0, true);
          centralView.setUint16(36, 0, true);
          centralView.setUint32(38, 0, true);
          centralView.setUint32(42, offset, true);
          centralHeader.set(name, 46);
          centralParts.push(centralHeader);

          offset += localHeader.length + data.length;
        }

        const centralSize = centralParts.reduce(
          (sum, part) => sum + part.length,
          0
        );
        const endRecord = new Uint8Array(22);
        const endView = new DataView(endRecord.buffer);
        endView.setUint32(0, 0x06054b50, true);
        endView.setUint16(4, 0, true);
        endView.setUint16(6, 0, true);
        endView.setUint16(8, files.length, true);
        endView.setUint16(10, files.length, true);
        endView.setUint32(12, centralSize, true);
        endView.setUint32(16, offset, true);
        endView.setUint16(20, 0, true);

        return concatBytes([...localParts, ...centralParts, endRecord]);
      }

      function concatBytes(parts) {
        const size = parts.reduce((sum, part) => sum + part.length, 0);
        const output = new Uint8Array(size);
        let offset = 0;
        for (const part of parts) {
          output.set(part, offset);
          offset += part.length;
        }
        return output;
      }

      let crcTable = null;

      function crc32(bytes) {
        if (!crcTable) {
          crcTable = new Uint32Array(256);
          for (let index = 0; index < 256; index += 1) {
            let value = index;
            for (let bit = 0; bit < 8; bit += 1) {
              value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
            }
            crcTable[index] = value >>> 0;
          }
        }

        let value = 0xffffffff;
        for (const byte of bytes) {
          value = crcTable[(value ^ byte) & 0xff] ^ (value >>> 8);
        }
        return (value ^ 0xffffffff) >>> 0;
      }
    </script>
  </body>
</html>
