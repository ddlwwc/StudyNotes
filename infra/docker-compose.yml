name: studynotes

services:
  mysql:
    image: mysql:8.4.5
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: studynotes
      MYSQL_USER: studynotes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-studynotes-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-studynotes-root-password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ngram-token-size=2
    volumes:
      - studynotes_mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-33066}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - studynotes

  migrate:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: runtime
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: mysql://studynotes:${MYSQL_PASSWORD:-studynotes-local-password}@mysql:3306/studynotes
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - studynotes
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["node", "server.js"]
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://studynotes:${MYSQL_PASSWORD:-studynotes-local-password}@mysql:3306/studynotes
      STUDYNOTES_BASE_URL: ${STUDYNOTES_BASE_URL:-http://127.0.0.1:8090}
      STUDYNOTES_REPOSITORY: mysql
      STUDYNOTES_STORAGE: ${STUDYNOTES_STORAGE:-memory}
      PUBLISH_REGISTRATION_SECRET: ${PUBLISH_REGISTRATION_SECRET:-local-only-registration-secret}
      PUBLISH_TIMESTAMP_SKEW_SECONDS: ${PUBLISH_TIMESTAMP_SKEW_SECONDS:-300}
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-}
      QINIU_DOMAIN: ${QINIU_DOMAIN:-}
      QINIU_UPLOAD_URL: ${QINIU_UPLOAD_URL:-https://upload.qiniup.com}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-300}
      OPENAPI_CONTRACT_PATH: /app/contracts/openapi.yaml
    ports:
      - "127.0.0.1:8090:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(async r=>{const body=await r.text();console.log(body);process.exit(r.ok?0:1)}).catch(e=>{console.error('健康检查请求失败：'+e.message);process.exit(1)})\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - studynotes

networks:
  studynotes:
    driver: bridge

volumes:
  studynotes_mysql:
