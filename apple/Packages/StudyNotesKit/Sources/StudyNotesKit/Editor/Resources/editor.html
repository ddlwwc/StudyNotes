<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: media:; media-src 'self' data: media:; connect-src 'none'; font-src 'self';">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <title>StudyNotes Editor</title>
</head>
<body>
  <main id="shell">
    <header id="toolbar" role="toolbar" aria-label="编辑工具栏">
      <button data-command="undo" title="撤销 (⌘Z)" aria-label="撤销">↶</button>
      <button data-command="redo" title="重做 (⇧⌘Z)" aria-label="重做">↷</button>
      <button data-command="clearFormat" title="清除格式 (⌘\\)" aria-label="清除格式">⌫</button>
      <button data-command="formatPainter" title="格式刷" aria-label="格式刷">🖌</button>
      <span class="separator"></span>
      <button id="paragraph-style" title="段落样式" aria-haspopup="menu" aria-expanded="false">
        正文 <span class="chevron">⌄</span>
      </button>
      <select id="font-size" title="字号" aria-label="字号">
        <option value="12px">12</option>
        <option value="14px">14</option>
        <option value="16px" selected>16</option>
        <option value="18px">18</option>
        <option value="20px">20</option>
        <option value="24px">24</option>
        <option value="28px">28</option>
        <option value="32px">32</option>
      </select>
      <select id="line-height" title="行距" aria-label="行距">
        <option value="1.4">1.4</option>
        <option value="1.6">1.6</option>
        <option value="1.72" selected>1.72</option>
        <option value="1.8">1.8</option>
        <option value="2">2.0</option>
      </select>
      <span class="separator"></span>
      <button data-command="bold" title="粗体 (⌘B)" aria-label="粗体"><strong>B</strong></button>
      <button data-command="italic" title="斜体 (⌘I)" aria-label="斜体"><em>I</em></button>
      <button data-command="underline" title="下划线 (⌘U)" aria-label="下划线"><span class="underline">U</span></button>
      <button data-command="strike" title="删除线 (⇧⌘X)" aria-label="删除线"><span class="strike">S</span></button>
      <button data-command="code" title="行内代码 (⌘E)" aria-label="行内代码">&lt;/&gt;</button>
      <button data-command="link" title="链接 (⌘K)" aria-label="链接">↗</button>
      <button id="color-toggle" title="文字颜色" aria-label="文字颜色" aria-haspopup="menu" aria-expanded="false"><span class="color-glyph">A</span></button>
      <button id="highlight-toggle" title="背景高亮" aria-label="背景高亮" aria-haspopup="menu" aria-expanded="false"><span class="highlight-glyph">H</span></button>
      <span class="separator"></span>
      <button data-command="alignLeft" title="左对齐 (⇧⌘L)" aria-label="左对齐">↤</button>
      <button data-command="alignCenter" title="居中 (⇧⌘E)" aria-label="居中">↔</button>
      <button data-command="alignRight" title="右对齐 (⇧⌘R)" aria-label="右对齐">↦</button>
      <button data-command="outdent" title="减少缩进 (⇧Tab)" aria-label="减少缩进">⇤</button>
      <button data-command="indent" title="增加缩进 (Tab)" aria-label="增加缩进">⇥</button>
      <span class="separator"></span>
      <button data-command="bulletList" title="无序列表" aria-label="无序列表">•</button>
      <button data-command="orderedList" title="有序列表" aria-label="有序列表">1.</button>
      <button data-command="taskList" title="任务列表" aria-label="任务列表">☑</button>
      <button data-command="quote" title="引用 (⌥⌘Q)" aria-label="引用">❝</button>
      <button data-command="codeBlock" title="代码块" aria-label="代码块">{ }</button>
      <button data-command="horizontalRule" title="分割线" aria-label="分割线">—</button>
      <span class="separator"></span>
      <button id="insert-block" title="插入块" aria-label="插入块" aria-haspopup="menu">＋</button>
      <button id="attach-image" title="插入图片占位" aria-label="插入图片占位">Img</button>
      <button id="attach-file" title="插入附件占位" aria-label="插入附件占位">File</button>
      <button id="attach-audio" title="插入音频" aria-label="插入音频">Audio</button>
      <button id="attach-video" title="插入视频" aria-label="插入视频">Video</button>
      <span class="spacer"></span>
      <button id="outline-toggle" title="大纲" aria-label="大纲">☰</button>
      <button id="find-toggle" data-command="find" title="查找 (⌘F)" aria-label="查找">⌕</button>
      <button id="source-toggle" title="源文本模式" aria-label="源文本模式">&lt;/&gt;</button>
    </header>

    <div id="paragraph-popover" class="toolbar-popover" role="menu" hidden>
      <button data-command="paragraph">正文</button>
      <button data-command="heading1">标题 1</button>
      <button data-command="heading2">标题 2</button>
      <button data-command="heading3">标题 3</button>
      <button data-command="heading4">标题 4</button>
      <button data-command="heading5">标题 5</button>
      <button data-command="heading6">标题 6</button>
    </div>
    <div id="color-popover" class="toolbar-popover swatch-popover" role="menu" hidden>
      <button data-color="#202124" style="--swatch:#202124" title="默认文字颜色" aria-label="默认文字颜色"></button>
      <button data-color="#dc2626" style="--swatch:#dc2626" title="红色" aria-label="红色"></button>
      <button data-color="#ea580c" style="--swatch:#ea580c" title="橙色" aria-label="橙色"></button>
      <button data-color="#ca8a04" style="--swatch:#ca8a04" title="黄色" aria-label="黄色"></button>
      <button data-color="#16a34a" style="--swatch:#16a34a" title="绿色" aria-label="绿色"></button>
      <button data-color="#2563eb" style="--swatch:#2563eb" title="蓝色" aria-label="蓝色"></button>
      <button data-color="#7c3aed" style="--swatch:#7c3aed" title="紫色" aria-label="紫色"></button>
      <button data-color="#db2777" style="--swatch:#db2777" title="粉色" aria-label="粉色"></button>
    </div>
    <div id="highlight-popover" class="toolbar-popover swatch-popover" role="menu" hidden>
      <button data-highlight="transparent" style="--swatch:transparent" title="无高亮" aria-label="无高亮"></button>
      <button data-highlight="#fef08a" style="--swatch:#fef08a" title="黄色高亮" aria-label="黄色高亮"></button>
      <button data-highlight="#bbf7d0" style="--swatch:#bbf7d0" title="绿色高亮" aria-label="绿色高亮"></button>
      <button data-highlight="#bfdbfe" style="--swatch:#bfdbfe" title="蓝色高亮" aria-label="蓝色高亮"></button>
      <button data-highlight="#fbcfe8" style="--swatch:#fbcfe8" title="粉色高亮" aria-label="粉色高亮"></button>
      <button data-highlight="#fed7aa" style="--swatch:#fed7aa" title="橙色高亮" aria-label="橙色高亮"></button>
    </div>

    <section id="title-row">
      <input id="title" type="text" autocomplete="off" spellcheck="false" aria-label="笔记标题" placeholder="无标题">
    </section>

    <aside id="outline" hidden>
      <div class="panel-heading">
        <span>大纲</span>
        <button id="outline-close" aria-label="关闭大纲">×</button>
      </div>
      <nav id="outline-list"></nav>
    </aside>

    <section id="find-panel" hidden aria-label="文档内查找">
      <input id="find-query" type="search" placeholder="查找正文" autocomplete="off">
      <span id="find-count">0/0</span>
      <button id="find-previous" aria-label="上一个">↑</button>
      <button id="find-next" aria-label="下一个">↓</button>
      <button id="find-close" aria-label="关闭查找">×</button>
    </section>

    <section id="editor-host">
      <div id="editor"></div>
      <textarea id="source" spellcheck="false" hidden></textarea>
      <div id="slash-menu" hidden></div>
      <div id="block-menu" hidden role="menu" aria-label="块菜单"></div>
      <div id="status-banner" role="status" hidden></div>
    </section>
  </main>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
